name: Validate Tasky plugin

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-plugin.mjs
      - run: node --test scripts/environment/environment.test.mjs
      - run: node --test scripts/codex-package.test.mjs
      - run: node scripts/build-codex-package.mjs submission
      - uses: actions/upload-artifact@v4
        with:
          name: tasky-openai-submission
          path: .tasky-runtime/packages/submission-*/*-submission.zip
          include-hidden-files: true
          if-no-files-found: error
